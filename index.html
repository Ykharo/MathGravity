<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Gravity Arcade</title>

    <!-- PWA Offline Tags -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F57C00">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #E65100; /* Naranja base */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Contenedor del juego - Optimizado para Landscape/iPad */
        #game-container {
            width: 100%;
            height: 100%;
            /* Eliminamos el max-width para permitir modo apaisado completo */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #F57C00;
            transition: background 0.5s ease;
        }

        /* Estilo Premium para el Slider de Volumen */
        .volume-container {
            margin: 20px 0;
            width: 80%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .volume-slider-wrapper {
            position: relative;
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
            z-index: 2;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            border: 2px solid #0ff;
            transition: transform 0.2s;
        }

        .volume-slider:active::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        .volume-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            width: 50%; /* Dinámico vía JS */
            z-index: 1;
            pointer-events: none;
        }

        .volume-label {
            font-family: 'monospace';
            font-size: 14px;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        /* Estrellas animadas para el Menú */
        @keyframes scrollBackground {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }
        
        canvas {
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 80px; /* Bajado otros 30px (50 -> 80) */
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #E65100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            text-align: center;
            transition: background 0.5s ease;
        }

        #main-menu.pro-bg {
            background-color: #000 !important;
            overflow: hidden;
        }

        /* Estrellas Parallax para el Menú */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        #main-menu.pro-bg .stars-container { display: block; }

        .star-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-repeat: repeat;
        }
        .layer1 {
            background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: scrollBackground 30s linear infinite;
            opacity: 0.8;
        }
        .layer2 {
            background-image: radial-gradient(1.5px 1.5px at 50px 70px, #fff, rgba(0,0,0,0));
            background-size: 300px 300px;
            animation: scrollBackground 20s linear infinite;
            opacity: 0.5;
        }
        .layer3 {
            background-image: radial-gradient(2px 2px at 100px 150px, #fff, rgba(0,0,0,0));
            background-size: 400px 400px;
            animation: scrollBackground 10s linear infinite;
            opacity: 0.3;
        }

        .menu-btn {
            background-color: #333;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-family: monospace;
            border-radius: 8px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            background-color: #0ff;
            color: #000;
        }
        /* Toggle Switch Estilo Pro */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
            border: 2px solid #0ff;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: #0ff;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4b0082;
            border-color: #f0f;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #f0f;
        }

        .mode-label {
            font-family: monospace;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        var GLOBAL_TOP_OFFSET = 0; // Ajuste dinámico para iPad/Chrome
        var GLOBAL_TENSION = 0.5;
        var GLOBAL_DRAG = 0.001;
        var GLOBAL_MAX_VEL = 150;
        var GLOBAL_ENGINE = 5.0;
        var GLOBAL_RADIO_GIRO = 8.0;
        var GLOBAL_AUTOPILOT = true;
        var GLOBAL_VALID_TABLES = [3,4,5,6,7,8,9];
        
        // --- Armeria Variables ---
        var GLOBAL_CANNON_AMMO = 4;
        var GLOBAL_MISSILE_AMMO = 2;
        var GLOBAL_RADAR_RADIUS = 300;
        var GLOBAL_BULLET_SPEED = 800;
        var GLOBAL_MISSILE_SPEED = 400;
        var GLOBAL_SHIELD_CHANCE = 0.25;
        var GLOBAL_ENEMY_FIRE_RATE = 2000; 
        var GLOBAL_ENEMY_BULLET_SPEED = 400;
        var GLOBAL_MISSILE_TURN = 0.1;
        var GLOBAL_PLAYER_SCALE = 0.09;
        var GLOBAL_ENEMY_SCALE = 0.11;
        var GLOBAL_ENEMY_ELITE_SCALE = 0.12;
        var GLOBAL_SHIELD_SCALE = 1.2;
        var GLOBAL_SHIELD_ALPHA = 0.4;
        
        var audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            window.GLOBAL_AUDIO_CTX = audioCtx;
            
            // Hack obligatorio para iOS Safari: Desbloquear el motor TTS con una interacción de usuario
            if ('speechSynthesis' in window) {
                let unlock = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlock);
            }
        }

        function setGlobalVolume(val) {
            window.GLOBAL_VOLUME = parseFloat(val);
            localStorage.setItem('mathGravVolume', val);
            
            // Actualizar Phaser si está listo
            if (window.gameScene && window.gameScene.sound) {
                window.gameScene.sound.volume = window.GLOBAL_VOLUME;
            }
            
            // Actualizar visual de los sliders
            const sliders = document.querySelectorAll('.volume-slider');
            const progressBars = document.querySelectorAll('.volume-progress');
            const labels = document.querySelectorAll('.volume-val-label');
            
            sliders.forEach(s => s.value = val);
            progressBars.forEach(p => p.style.width = (val * 100) + '%');
            labels.forEach(l => l.innerText = Math.round(val * 100) + '%');
        }

        // Cargar volumen al inicio
        window.addEventListener('DOMContentLoaded', () => {
            const savedVol = localStorage.getItem('mathGravVolume') || 0.5;
            setGlobalVolume(savedVol);

            // Inicializar ancho del lab
            const gameWidth = window.innerWidth;
            document.getElementById('valGameWidth').innerText = gameWidth;
            document.getElementById('sliderGameWidth').value = gameWidth;
        });
        
        function updateValidTables() {
            let active = [];
            for (let i = 1; i <= 10; i++) {
                if (document.getElementById('chkTable' + i).checked) {
                    active.push(i);
                }
            }
            if (active.length === 0) {
                document.getElementById('chkTable1').checked = true;
                active = [1];
            }
            GLOBAL_VALID_TABLES = active;
        }

        function startGameFromMenu(mode) {
            // DESBLOQUEO MAESTRO: Forzar reanudación del contexto de audio de Phaser desde el evento del DOM
            if (window.gameScene && window.gameScene.sound && window.gameScene.sound.context) {
                window.gameScene.sound.context.resume();
            }
            if (window.GLOBAL_AUDIO_CTX) window.GLOBAL_AUDIO_CTX.resume();

            initAudio();
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('btn-back-menu').style.display = 'block';
            if (window.gameScene) {
                window.gameScene.startGameMode(mode);
            }
        }
        
        function returnToMenu() {
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('btn-back-menu').style.display = 'none';
            if (window.gameScene) {
                window.gameScene.returnToMenu();
            }
        }
        
        function togglePause() {
            if (window.gameScene) window.gameScene.togglePause();
        }
        
        function activateSingularity() {
            if (window.gameScene) window.gameScene.triggerSingularity();
        }
        
        function updatePhysVar(name, val) {
            document.getElementById('val' + name).innerText = val;
            if (name === 'Tension') GLOBAL_TENSION = parseFloat(val);
            if (name === 'Engine') GLOBAL_ENGINE = parseFloat(val);
            if (name === 'Turn') GLOBAL_RADIO_GIRO = parseFloat(val);
            if (name === 'Drag') {
                GLOBAL_DRAG = parseFloat(val);
                if (window.player) window.player.setDrag(GLOBAL_DRAG);
            }
            if (name === 'MaxVel') {
                GLOBAL_MAX_VEL = parseInt(val);
                if (window.player) window.player.setMaxVelocity(GLOBAL_MAX_VEL);
            }
            if (name === 'RingRadius') {
                window.GLOBAL_RING_RADIUS_PCT = parseFloat(val);
            }
            if (name === 'GameWidth') {
                window.GLOBAL_GAME_WIDTH = parseInt(val);
            }
            if (name === 'CannonAmmo') window.GLOBAL_CANNON_AMMO = parseInt(val);
            if (name === 'MissileAmmo') window.GLOBAL_MISSILE_AMMO = parseInt(val);
            if (name === 'Radar') window.GLOBAL_RADAR_RADIUS = parseInt(val);
            if (name === 'BulletVel') window.GLOBAL_BULLET_SPEED = parseInt(val);
            if (name === 'MissileVel') window.GLOBAL_MISSILE_SPEED = parseInt(val);
            if (name === 'MissileTurn') window.GLOBAL_MISSILE_TURN = parseFloat(val);
            if (name === 'ShieldChance') window.GLOBAL_SHIELD_CHANCE = parseFloat(val);
            if (name === 'EnemyFireRate') window.GLOBAL_ENEMY_FIRE_RATE = parseInt(val);
            if (name === 'EnemyBulletSpeed') window.GLOBAL_ENEMY_BULLET_SPEED = parseInt(val);
            if (name === 'PlayerScale') {
                window.GLOBAL_PLAYER_SCALE = parseFloat(val);
                if (window.player && window.USE_PRO_ASSETS) window.player.setScale(window.GLOBAL_PLAYER_SCALE);
            }
            if (name === 'EnemyScale') {
                window.GLOBAL_ENEMY_SCALE = parseFloat(val);
            }
            if (name === 'EnemyEliteScale') {
                window.GLOBAL_ENEMY_ELITE_SCALE = parseFloat(val);
            }
            if (name === 'ShieldScale') {
                window.GLOBAL_SHIELD_SCALE = parseFloat(val);
                if (window.shieldSprite) window.shieldSprite.setScale(window.GLOBAL_SHIELD_SCALE * 0.5);
            }
            if (name === 'ShieldAlpha') {
                window.GLOBAL_SHIELD_ALPHA = parseFloat(val);
                if (window.shieldSprite) window.shieldSprite.setAlpha(window.GLOBAL_SHIELD_ALPHA);
            }
            if (name === 'TopOffset') {
                window.GLOBAL_TOP_OFFSET = parseInt(val);
                // Ajustar elementos HTML en tiempo real
                let overlay = document.getElementById('ui-overlay');
                let leftContainer = document.getElementById('ui-left-container');
                if (overlay) overlay.style.top = (80 + window.GLOBAL_TOP_OFFSET) + 'px';
                if (leftContainer) leftContainer.style.top = (120 + window.GLOBAL_TOP_OFFSET) + 'px';
            }
        }
        
        function toggleRingVisible(cb) {
            window.GLOBAL_RING_VISIBLE = cb.checked;
        }
        
        function toggleLab() {
            var lab = document.getElementById('debug-panel');
            lab.style.display = (lab.style.display === 'none') ? 'block' : 'none';
        }
        
        function toggleArmeria() {
            var armeria = document.getElementById('armeria-panel');
            armeria.style.display = (armeria.style.display === 'none') ? 'block' : 'none';
        }

        // PWA Offline Registration
        // Service Worker desactivado para evitar problemas de caché en desarrollo
        /*
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered:', reg.scope);
                }).catch(err => {
                    console.log('SW Error:', err);
                });
            });
        }
        */
    </script>
</head>
<body>
    <div id="main-menu">
        <div class="stars-container">
            <div class="star-layer layer1"></div>
            <div class="star-layer layer2"></div>
            <div class="star-layer layer3"></div>
        </div>
        <h1 style="font-size: 36px; text-shadow: 2px 2px 0px #000; margin-bottom: 20px; color: #fff; z-index: 10;">MATH GRAVITY</h1>
        
        <div style="margin-bottom: 30px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="label-mode" class="mode-label" style="color: #0ff;">MODO GEOMÉTRICO</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-pro-assets" onchange="
                        window.USE_PRO_ASSETS = this.checked;
                        document.getElementById('label-mode').innerText = this.checked ? 'MODO PROFESIONAL' : 'MODO GEOMÉTRICO';
                        document.getElementById('label-mode').style.color = this.checked ? '#f0f' : '#0ff';
                        document.getElementById('main-menu').className = this.checked ? 'pro-bg' : '';
                        document.body.style.backgroundColor = this.checked ? '#000' : '#E65100';
                        document.getElementById('game-container').style.backgroundColor = this.checked ? '#000' : '#F57C00';
                    ">
                    <span class="slider"></span>
                </label>
            </div>
            <span style="font-size: 10px; color: rgba(255,255,255,0.5);">CAMBIA EL ESTILO VISUAL Y SONORO</span>
        </div>

        <div class="volume-container">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
                <span class="volume-label">VOLUMEN MAESTRO</span>
                <span class="volume-label volume-val-label">50%</span>
            </div>
            <div class="volume-slider-wrapper">
                <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" oninput="setGlobalVolume(this.value)">
                <div class="volume-progress"></div>
            </div>
        </div>

        <button class="menu-btn" onclick="startGameFromMenu(1)">1. MODO SECUENCIAL</button>
        <button class="menu-btn" onclick="startGameFromMenu(2)">2. ALEATORIO POR TABLA</button>
        <button class="menu-btn" onclick="startGameFromMenu(3)">3. SUPERVIVENCIA TOTAL</button>
    </div>

    <div id="ui-overlay">
        <span>Puntuación: <span id="score">0</span></span>
    </div>

    <div id="ui-left-container" style="position: absolute; top: 120px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
        <button onclick="toggleArmeria()" style="font-size: 18px; cursor: pointer; background: rgba(0,20,40,0.6); color: #0FF; border: 1px solid #0FF; border-radius: 8px; padding: 8px 12px; font-family: monospace;">
            🔫 ARMERÍA
        </button>
        <button onclick="toggleLab()" style="font-size: 18px; cursor: pointer; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; border-radius: 8px; padding: 8px 12px; font-family: monospace;">
            ⚙️ LAB
        </button>
    </div>

    <div id="ui-bottom-right-container" style="position: absolute; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
        <button id="btn-back-menu" onclick="returnToMenu()" style="font-family: monospace; font-size: 16px; cursor: pointer; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 8px; border: 1px solid #fff; display: none;">
            🔙 MENÚ
        </button>
        <button id="btn-pause" onclick="togglePause()" style="font-family: monospace; font-size: 20px; cursor: pointer; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 8px; border: 1px solid #fff;">
            ⏸ PAUSA
        </button>
        
        <button id="btn-singularity" onclick="activateSingularity()" style="font-family: monospace; font-size: 16px; font-weight: bold; cursor: pointer; color: #888; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; border: 2px solid #555; pointer-events: none; transition: all 0.3s; display: none;">
            NUCLEO TEMPORAL: 0/3
        </button>

        <label id="btn-autopilot" style="font-family: monospace; font-size: 18px; cursor: pointer; color: #0f0; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border: 2px solid #0f0; transition: all 0.3s; margin: 0;">
            <input type="checkbox" checked onchange="
                window.GLOBAL_AUTOPILOT=this.checked; 
                document.getElementById('btn-autopilot').style.borderColor = this.checked ? '#0f0' : '#0ff';
                document.getElementById('btn-autopilot').style.color = this.checked ? '#0f0' : '#0ff';
            " style="transform: scale(1.5); margin-right: 12px; cursor: pointer;">
            Auto-Piloto Evasivo
        </label>
    </div>

    <!-- PANEL DE DEBUG PROVISORIO -->
    <div id="debug-panel" style="display: none; position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); color: #0f0; padding: 15px; border-radius: 8px; z-index: 1000; font-family: monospace; border: 1px solid #0f0; max-height: 85%; overflow-y: auto;">
        <h4 style="margin: 0 0 10px 0; color: #fff;">Laboratorio de Físicas</h4>
        
        <h5 style="margin: 5px 0; color: #ff0;">Tablas Activas:</h5>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 15px;">
            <label><input type="checkbox" id="chkTable1" onchange="updateValidTables()"> 1</label>
            <label><input type="checkbox" id="chkTable2" onchange="updateValidTables()"> 2</label>
            <label><input type="checkbox" id="chkTable3" checked onchange="updateValidTables()"> 3</label>
            <label><input type="checkbox" id="chkTable4" checked onchange="updateValidTables()"> 4</label>
            <label><input type="checkbox" id="chkTable5" checked onchange="updateValidTables()"> 5</label>
            <label><input type="checkbox" id="chkTable6" checked onchange="updateValidTables()"> 6</label>
            <label><input type="checkbox" id="chkTable7" checked onchange="updateValidTables()"> 7</label>
            <label><input type="checkbox" id="chkTable8" checked onchange="updateValidTables()"> 8</label>
            <label><input type="checkbox" id="chkTable9" checked onchange="updateValidTables()"> 9</label>
            <label><input type="checkbox" id="chkTable10" onchange="updateValidTables()"> 10</label>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="color: #0ff;">Volumen: <span class="volume-val-label">50%</span></label>
            <div class="volume-slider-wrapper" style="height: 8px; margin-top: 5px;">
                <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" oninput="setGlobalVolume(this.value)">
                <div class="volume-progress"></div>
            </div>
        </div>
        
        <label>Aceleración (Fondo Trasero): <span id="valTension">0.5</span></label><br>
        <input type="range" min="0.5" max="30" step="0.5" value="0.5" oninput="updatePhysVar('Tension', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Fuerza Transversal (Radio/Curva de Giro): <span id="valTurn">8.0</span></label><br>
        <input type="range" min="1" max="30" step="0.5" value="8.0" oninput="updatePhysVar('Turn', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Motor (Auto-Empuje): <span id="valEngine">5</span></label><br>
        <input type="range" min="0" max="600" step="1" value="5" oninput="updatePhysVar('Engine', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
        
        <label>Fricción (Patinar - Drag): <span id="valDrag">0.001</span></label><br>
        <input type="range" min="0.001" max="0.3" step="0.005" value="0.001" oninput="updatePhysVar('Drag', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
        
        <label>Límite Velocidad Max: <span id="valMaxVel">150</span></label><br>
        <input type="range" min="50" max="1500" step="50" value="150" oninput="updatePhysVar('MaxVel', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Ancho del Juego (Fondo Naranja): <span id="valGameWidth">---</span></label><br>
        <input type="range" id="sliderGameWidth" min="300" max="2500" step="50" value="600" oninput="updatePhysVar('GameWidth', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Radio Muro Energía (Multiplicador): <span id="valRingRadius">0.15</span></label><br>
        <input type="range" min="0.1" max="0.8" step="0.05" value="0.15" oninput="updatePhysVar('RingRadius', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
        
        <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: #fff;">
            <input type="checkbox" checked onchange="toggleRingVisible(this)" style="transform: scale(1.3);">
            Muro de Energía Activo
        </label>

        <hr style="border: 0.5px solid #0f0; margin: 15px 0;">
        <label style="color: #ff0;">Ajuste Vertical UI (iPad/Notch): <span id="valTopOffset">0</span></label><br>
        <input type="range" min="-150" max="150" step="5" value="0" oninput="updatePhysVar('TopOffset', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
    </div>

    <!-- PANEL DE ARMERIA -->
    <div id="armeria-panel" style="display: none; position: absolute; top: 70px; right: 20px; background: rgba(0,20,40,0.85); color: #0FF; padding: 15px; border-radius: 8px; z-index: 1000; font-family: monospace; border: 1px solid #0FF; max-height: 80%; overflow-y: auto; width: 300px;">
        <h4 style="margin: 0 0 10px 0; color: #fff;">Armería (Modo 3)</h4>
        
        <label>Munición Balas (Recarga): <span id="valCannonAmmo">4</span></label><br>
        <input type="range" min="1" max="20" step="1" value="4" oninput="updatePhysVar('CannonAmmo', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Munición Misiles (Recarga): <span id="valMissileAmmo">2</span></label><br>
        <input type="range" min="1" max="10" step="1" value="2" oninput="updatePhysVar('MissileAmmo', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Radio Detección Radar: <span id="valRadar">300</span></label><br>
        <input type="range" min="100" max="800" step="20" value="300" oninput="updatePhysVar('Radar', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Velocidad Balas: <span id="valBulletVel">800</span></label><br>
        <input type="range" min="200" max="2000" step="50" value="800" oninput="updatePhysVar('BulletVel', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
        
        <label>Velocidad Misiles (Homing): <span id="valMissileVel">400</span></label><br>
        <input type="range" min="100" max="1500" step="50" value="400" oninput="updatePhysVar('MissileVel', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
        
        <label>Fuerza Giro Misiles: <span id="valMissileTurn">0.1</span></label><br>
        <input type="range" min="0.01" max="0.5" step="0.01" value="0.1" oninput="updatePhysVar('MissileTurn', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Probabilidad Escudo Enemigo: <span id="valShieldChance">0.25</span></label><br>
        <input type="range" min="0" max="1" step="0.05" value="0.25" oninput="updatePhysVar('ShieldChance', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Frecuencia Disparo Enemigo (ms): <span id="valEnemyFireRate">2000</span></label><br>
        <input type="range" min="500" max="5000" step="100" value="2000" oninput="updatePhysVar('EnemyFireRate', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Velocidad Bala Enemiga: <span id="valEnemyBulletSpeed">400</span></label><br>
        <input type="range" min="100" max="800" step="50" value="400" oninput="updatePhysVar('EnemyBulletSpeed', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <hr style="border: 0.5px solid #0FF; margin: 15px 0;">
        <h5 style="margin: 0 0 10px 0;">Dimensiones de Naves (Modo Pro)</h5>
        
        <label>Escala Jugador: <span id="valPlayerScale">0.09</span></label><br>
        <input type="range" min="0.05" max="0.5" step="0.01" value="0.09" oninput="updatePhysVar('PlayerScale', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Escala Enemigos Básicos: <span id="valEnemyScale">0.11</span></label><br>
        <input type="range" min="0.05" max="0.5" step="0.01" value="0.11" oninput="updatePhysVar('EnemyScale', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Escala Enemigos Élite: <span id="valEnemyEliteScale">0.12</span></label><br>
        <input type="range" min="0.05" max="0.5" step="0.01" value="0.12" oninput="updatePhysVar('EnemyEliteScale', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Escala Escudo: <span id="valShieldScale">1.2</span></label><br>
        <input type="range" min="0.5" max="3.0" step="0.1" value="1.2" oninput="updatePhysVar('ShieldScale', this.value)" style="width: 100%; margin-bottom: 10px;"><br>

        <label>Transparencia Escudo: <span id="valShieldAlpha">0.4</span></label><br>
        <input type="range" min="0.1" max="1.0" step="0.05" value="0.4" oninput="updatePhysVar('ShieldAlpha', this.value)" style="width: 100%; margin-bottom: 10px;"><br>
    </div>

    <div id="game-container"></div>

    <script src="game.js"></script>
</body>
</html>
